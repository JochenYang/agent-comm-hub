name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
  pull_request:
    paths-ignore:
      - 'app/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: agent-comm-hub-tgz-${{ matrix.os }}
          path: agent-comm-hub-*.tgz
          if-no-files-found: error
