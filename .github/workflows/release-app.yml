name: release-app

# M4 T-4.3: tag 触发 —— 构建三平台安装包 + 起草 release notes + 发 GitHub Release。
#
# 用法:
#   1. bump 版本 (app/package.json + app/src-tauri/Cargo.toml + app/src-tauri/tauri.conf.json 一致)
#   2. 在 app/CHANGELOG.md 顶部添加新版本块
#   3. git tag app-v1.x.y && git push origin app-v1.x.y
#   4. 此 workflow 自动跑 —— 三平台 build → draft release
#
# 注意: 只匹配 app-v* tag —— 主仓 hub 的发布 tag（v0.x / v1.x）不能触发本流程。

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-info:
    name: extract info
    runs-on: ubuntu-latest
    outputs:
      prev_tag: ${{ steps.prev.outputs.PREV_TAG }}
      cur_tag: ${{ steps.tag.outputs.CUR_TAG }}
      version: ${{ steps.tag.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prev
        run: |
          PREV=$(git tag --sort=-creatordate | grep -E '^app-v' | head -n 2 | tail -n 1 || echo "")
          if [ -z "$PREV" ]; then
            PREV=$(git rev-list --max-parents=0 HEAD | head -n 1)
          fi
          echo "PREV_TAG=$PREV" >> $GITHUB_OUTPUT
      - id: tag
        run: |
          REF=${GITHUB_REF_NAME}
          echo "CUR_TAG=$REF" >> $GITHUB_OUTPUT
          echo "VERSION=${REF#app-v}" >> $GITHUB_OUTPUT

  notes:
    name: draft release notes
    needs: tag-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate notes
        id: notes
        run: |
          # 传 version（1.0.0）而不是 tag 名（app-v1.0.0）：脚本按 CHANGELOG 的
          # "[1.0.0]" 段匹配，带 app-v 前缀会 "section not found"（历史踩坑）。
          ROOT=$(git rev-list --max-parents=0 HEAD | head -n 1)
          if [ "${{ needs.tag-info.outputs.prev_tag }}" = "$ROOT" ]; then
            node app/scripts/release-notes-app.mjs dummy ${{ needs.tag-info.outputs.version }} > /tmp/notes.md
          else
            node app/scripts/release-notes-app.mjs ${{ needs.tag-info.outputs.prev_tag }} ${{ needs.tag-info.outputs.version }} > /tmp/notes.md
          fi
          wc -l /tmp/notes.md
      - name: Upload notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: /tmp/notes.md

  build:
    name: build-${{ matrix.os }}
    needs: tag-info
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.AppImage
              app/src-tauri/target/release/bundle/**/*.deb
          - os: windows-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.msi
              app/src-tauri/target/release/bundle/**/*.exe
              app/src-tauri/target/release/bundle/**/*.zip
          - os: macos-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.dmg

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup 必须在 setup-node 之前（cache: pnpm 需要 pnpm 已就绪）
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'app/src-tauri -> target' }

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cd src-tauri && cargo test --lib --locked
      - run: pnpm tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn

  publish-release:
    name: github release
    needs: [build, notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: actions/download-artifact@v4
        with: { name: release-notes, path: artifacts }
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.cur_tag }}
          name: agent-comm-hub-app ${{ needs.tag-info.outputs.version }}
          body_path: artifacts/release-notes.md
          draft: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
          fail_on_unmatched_files: false
