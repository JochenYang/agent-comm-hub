name: ci-app

# M4 T-4.1: GH Actions 三平台矩阵 (ubuntu / windows / macos)。
# 每个平台跑 typecheck + cargo test + tauri build；
# 一次 tauri:build 产出该平台所有配置的 targets（tauri.conf bundle.targets），
# 把安装包上传为 artifact。
#
# 触发:
#   - push 到 main 且触动 app/**
#   - PR
#   - workflow_dispatch

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/ci-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.AppImage
              app/src-tauri/target/release/bundle/**/*.deb
          - os: windows-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.msi
              app/src-tauri/target/release/bundle/**/*.exe
              app/src-tauri/target/release/bundle/**/*.zip
          - os: macos-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.dmg

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # 不再给 setup-node 挂 cache: pnpm。app/package.json 固定 packageManager
      # pnpm@11.7.0，pnpm 在 app/ 内会自我切换到 11.x，而 setup-node 的缓存步骤是用
      # 这里装的 pnpm 10 去探测 store 路径的：两者算出的路径在 windows 上不一致，
      # 后置步骤直接报 "Path Validation Error"（路径不存在）把 job 判红。app 的依赖
      # 安装本身只要几秒，不值得为此担一个会失败的缓存步骤。
      # pnpm/action-setup 仍保留：job 里的 pnpm 命令依赖它提供的 pnpm。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> target'

      - name: Linux system deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Version consistency (package.json = Cargo.toml = tauri.conf.json)
        # Windows runner 默认 pwsh（\" 非转义），显式 bash 保证 grep/sed/node -p 语义一致
        shell: bash
        run: |
          JS=$(node -p "require('./package.json').version")
          RS=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          TA=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "package.json=$JS Cargo.toml=$RS tauri.conf=$TA"
          [ "$JS" = "$RS" ] && [ "$JS" = "$TA" ] || { echo "version mismatch!"; exit 1; }

      - name: Type-check
        run: pnpm typecheck

      - name: Cargo test (lib only — no GUI)
        run: cd src-tauri && cargo test --lib --locked

      - name: Build (tauri bundle, all configured targets)
        run: pnpm tauri:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 14
