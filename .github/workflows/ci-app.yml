name: ci-app

# M4 T-4.1: GH Actions 三平台矩阵 (ubuntu / windows / macos)。
# 每个平台跑 typecheck + cargo test + tauri build；
# 一次 tauri:build 产出该平台所有配置的 targets（tauri.conf bundle.targets），
# 把安装包上传为 artifact。
#
# 触发:
#   - push 到 main 且触动 app/**
#   - PR
#   - workflow_dispatch

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/ci-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.AppImage
              app/src-tauri/target/release/bundle/**/*.deb
          - os: windows-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.msi
              app/src-tauri/target/release/bundle/**/*.exe
              app/src-tauri/target/release/bundle/**/*.zip
          - os: macos-latest
            artifacts: |
              app/src-tauri/target/release/bundle/**/*.dmg

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # 顺序必须 pnpm/action-setup 在前：setup-node 的 cache: pnpm 会调用
      # pnpm 计算 lockfile 缓存 key，后装 pnpm 会报 "Unable to locate executable file: pnpm"。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> target'

      - name: Linux system deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Version consistency (package.json = Cargo.toml = tauri.conf.json)
        run: |
          JS=$(node -p "require('./package.json').version")
          RS=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          TA=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "package.json=$JS Cargo.toml=$RS tauri.conf=$TA"
          [ "$JS" = "$RS" ] && [ "$JS" = "$TA" ] || { echo "version mismatch!"; exit 1; }

      - name: Type-check
        run: pnpm typecheck

      - name: Cargo test (lib only — no GUI)
        run: cd src-tauri && cargo test --lib --locked

      - name: Build (tauri bundle, all configured targets)
        run: pnpm tauri:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 14
