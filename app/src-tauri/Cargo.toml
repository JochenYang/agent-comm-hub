[package]
name = "agent-comm-hub-app"
version = "1.0.0"
description = "Desktop GUI for agent-comm-hub"
authors = ["agent-comm-hub contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "agent_comm_hub_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures = "0.3"
thiserror = "1"
log = "0.4"
anyhow = "1"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
